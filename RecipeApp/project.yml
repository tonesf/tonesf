name: RecipeApp
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""  # Fill in your Apple Developer Team ID

targets:
  RecipeApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RecipeApp
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.RecipeApp
        INFOPLIST_FILE: RecipeApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: RecipeApp/RecipeApp.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: RecipeApp/RecipeApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourname.recipeapp
    dependencies:
      - target: ShareExtension

  ShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension
      # Shared files from the main app
      - path: RecipeApp/Networking/APIClient.swift
      - path: RecipeApp/Networking/DTOs.swift
      - path: RecipeApp/Models/RecipeModel.swift
      - path: RecipeApp/Models/IngredientModel.swift
      - path: RecipeApp/Models/StepModel.swift
      - path: RecipeApp/Persistence/PersistenceController.swift
      - path: RecipeApp/UnitConversion/CookingUnit.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.RecipeApp.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourname.recipeapp
